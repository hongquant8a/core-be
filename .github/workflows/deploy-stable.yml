name: Deploy (stable)

on:
  push:
    branches: [stable]

jobs:
  deploy:
    name: Deploy all servers
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy script
        run: |
          chmod +x deploy.sh
          SITES="${{ secrets.DEPLOY_SITES }}" bash deploy.sh --be-only