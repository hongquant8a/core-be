name: Deploy (feat/refactor-noti)

on:
  push:
    branches: [feat/refactor-noti]

jobs:
  deploy:
    name: Deploy danatec-test backend
    runs-on: [self-hosted, danatectest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code to deploy directory
        uses: actions/checkout@v4
        with:
          path: /www/wwwroot/danatec-test.theworkpc.com/backend
          clean: false

      - name: Fix ownership
        run: |
          sudo chown -R www:www /www/wwwroot/danatec-test.theworkpc.com/backend/

      - name: Composer install
        working-directory: /www/wwwroot/danatec-test.theworkpc.com/backend
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Run migrations
        working-directory: /www/wwwroot/danatec-test.theworkpc.com/backend
        run: |
          php artisan migrate --force

      - name: Optimize
        working-directory: /www/wwwroot/danatec-test.theworkpc.com/backend
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

      - name: Set permissions
        run: |
          sudo chmod -R 775 /www/wwwroot/danatec-test.theworkpc.com/backend/storage || true
          sudo chmod -R 775 /www/wwwroot/danatec-test.theworkpc.com/backend/bootstrap/cache || true

      - name: Gửi thông báo Telegram 📩
        if: always()
        env:
          BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="✅"
          SHA="\${{ github.sha }}"
          SHORT_SHA="\${SHA:0:7}"
          if [ "\${{ job.status }}" != "success" ]; then STATUS="❌"; fi
          TEXT="\${STATUS} Deploy <b>danatec-test</b>%0A"
          TEXT+="Branch: <code>\${{ github.ref_name }}</code>%0A"
          TEXT+="Commit: <code>\${SHORT_SHA}</code>%0A"
          TEXT+="Status: <b>\${{ job.status }}</b>%0A"
          TEXT+="%0A<a href='https://github.com/hongquant8a/core-be/actions/runs/\${{ github.run_id }}'>View details</a>"
          curl -s -X POST "https://api.telegram.org/bot\${BOT_TOKEN}/sendMessage" \
            -d "chat_id=\${CHAT_ID}" -d "text=\${TEXT}" -d "parse_mode=HTML"
          echo "Telegram notification sent: \${STATUS}"
