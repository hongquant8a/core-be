name: Deploy Danatec Test BE

on:
  push:
    branches: [feat/refactor-noti]

jobs:
  deploy:
    name: Deploy danatec-test backend
    runs-on: [self-hosted, danatectest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Deploy code using git pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIR="/www/wwwroot/danatec-test.theworkpc.com/backend"
          # URL kèm token để clone/fetch repo private; không lưu token vào .git/config
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/hongquant8a/core-be.git"
          CLEAN_URL="https://github.com/hongquant8a/core-be.git"
          mkdir -p "$DIR"
          # Thư mục có thể đang thuộc www từ lần deploy trước -> giành lại quyền cho user runner
          sudo chown -R "$(id -un):$(id -gn)" "$DIR"
          cd "$DIR"
          # Lần đầu chuyển từ rsync sang git: khởi tạo repo tại chỗ, KHÔNG xóa thư mục
          # để giữ nguyên .env, storage (uploads/logs), vendor đã có sẵn trên server.
          if [ ! -d "$DIR/.git" ]; then
            git init -q
            git remote add origin "$CLEAN_URL"
          fi
          # Chẩn đoán: in TÊN các config auth kế thừa (không in giá trị/token) để lần sau dễ soi
          git config --list --show-origin --name-only 2>/dev/null | grep -iE 'extraheader|credential|insteadof' || echo "khong co config auth ke thua"
          # Xóa credential helper + extraHeader kế thừa từ config runner (một lần checkout/clone cũ
          # để lại Authorization header với token đã hết hạn), buộc git dùng token trong AUTH_URL.
          git -c credential.helper= \
              -c http.extraHeader= \
              -c 'http.https://github.com/.extraHeader=' \
              fetch "$AUTH_URL" feat/refactor-noti --depth 1
          git reset --hard FETCH_HEAD
          # git clean -fd KHÔNG xóa file gitignore (.env, /vendor, storage/* runtime) -> an toàn dữ liệu
          git clean -fd

      - name: Composer install
        working-directory: /www/wwwroot/danatec-test.theworkpc.com/backend
        run: |
          composer install --no-dev --optimize-autoloader

      - name: Run migrations
        working-directory: /www/wwwroot/danatec-test.theworkpc.com/backend
        run: |
          php artisan migrate --force

      - name: Optimize
        working-directory: /www/wwwroot/danatec-test.theworkpc.com/backend
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

      - name: Set ownership + permissions
        run: |
          sudo chown -R www:www /www/wwwroot/danatec-test.theworkpc.com/backend/
          sudo chmod -R 775 /www/wwwroot/danatec-test.theworkpc.com/backend/storage || true
          sudo chmod -R 775 /www/wwwroot/danatec-test.theworkpc.com/backend/bootstrap/cache || true

      - name: Gửi thông báo Telegram 📩
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="✅"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [ "${{ job.status }}" != "success" ]; then STATUS="❌"; fi
          TEXT="${STATUS} Deploy <b>danatec-test BE</b>%0A"
          TEXT+="Branch: <code>${{ github.ref_name }}</code>%0A"
          TEXT+="Commit: <code>${SHORT_SHA}</code>%0A"
          TEXT+="Status: <b>${{ job.status }}</b>%0A"
          TEXT+="%0A<a href='https://github.com/hongquant8a/core-be/actions/runs/${{ github.run_id }}'>View details</a>"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=HTML"
          echo "Telegram notification sent: ${STATUS}"
